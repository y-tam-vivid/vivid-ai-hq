# 日次ジョブの定義表（正本）── ここに書けば bin/daily_jobs.sh が実行する
#
# ★役割は bin/cron/mini.cron と分けてある。二重管理にしないための線引き：
#
#   bin/cron/mini.cron   = 本物の crontab へ投函する行の置き場。
#                          crontab への書き込みが直ったら bin/cron_apply.sh が拾って入れる。
#   このファイル         = crontab に書き込めない「いま」動かす日次ジョブの正本。
#                          vivid-sync.sh(*/15稼働中) → bin/daily_jobs.sh が読んで実行する。
#
#   ★同じジョブを両方に置かない。ジョブをこちらへ移したら mini.cron 側からは消す。
#     残したまま crontab 書き込みが直ると、同じジョブが2経路で二重に走る。
#
# 書式（タブ区切り）: HH:MM<TAB>ジョブ名(状態ファイルのキー・英数字)<TAB>コマンド
#   - 1日1回だけ実行する（状態ファイル ~/.vivid-relay/daily_jobs_state/<ジョブ名>.done で管理）
#   - 定刻を過ぎていれば拾う（例: 08:00のジョブをMacが08:14まで寝ていたら08:15の呼び出しで走る）
#   - 日をまたいだら諦める（状態ファイルの「今日」判定が変わるので、前日分を追いかけない）
#   - ★実測でドライラン／本実行を通したものだけ置く。未検証のものを置かない
#
# 07:25 intake_register.py … つるが「cronに載せてよい」と判定済み（2026-08-20）
07:25	intake_register	/usr/bin/python3 $HOME/.vivid-relay/intake_register.py --run --beat
