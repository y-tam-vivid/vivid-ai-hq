<title>119番 解決パートナー</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: 119番の資料群（打合せ資料v2.0・医療連携提案v1.1・会社案内v1.2）とCI・VI仕様書v1.0に合わせる。白地にサンドの面、色帯付きカード、ティールの英字見出し、ゴシック。ロゴが紺なのでライト単一テーマ */
:root{
  color-scheme:light;
  --bg:#ffffff; --band:#f4f1ea; --surface:#ffffff; --ink:#1e2a33; --navy:#0e2a47; --muted:#5c6b73;
  --line:#d8dee2; --accent:#e2733b; --accent-d:#b85a2a; --accent-l:#f0b08e; --link:#1c7293; --link-l:#cfe3ea;
  --teal:#1c7293; --sky:#57a6c9; --navy-soft:#eaf2f6; --onnavy:#f2f5f8; --onnavy-muted:#9fb6c9;
  --sans:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --serif:var(--sans); --mono:var(--sans);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.9;letter-spacing:.02em;text-wrap:pretty}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.narrow{max-width:820px}
h1,h2,h3{font-family:var(--sans);font-weight:500;color:var(--navy);letter-spacing:.03em;text-wrap:balance;line-height:1.45;margin:0}
p{margin:0}
a{color:var(--link)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.ey{display:flex;flex-direction:column;gap:10px}
.ey .en{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--teal);font-weight:500}
.ey .bar{display:none}
.hero .ey .sub-ja{font-size:14px;color:var(--muted);letter-spacing:.06em;margin-top:-4px}
.art-photo{aspect-ratio:21/9}
.hero .ey .bar{display:block;width:72px;height:4px;background:var(--accent);order:-1}

/* header */
.top-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-bar .wrap{display:flex;align-items:center;gap:8px 24px;padding-block:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo img{height:40px;width:auto;display:block}
.logo span{font-family:var(--sans);font-size:14px;color:var(--navy);border-left:1px solid var(--line);padding-left:12px;letter-spacing:.06em}
.nav{display:flex;gap:2px 22px;flex-wrap:wrap;margin-left:auto;align-items:center}
.nav a{text-decoration:none;color:var(--navy);font-size:14px;letter-spacing:.06em;padding-block:4px;border-bottom:1px solid transparent}
.nav a[aria-current="page"]{border-bottom-color:var(--accent)}
.nav a.cta-s{background:var(--accent);color:#fff;padding:7px 16px;border-radius:2px;border:0}
@media (max-width:700px){.nav{width:100%;margin-left:0;flex-wrap:nowrap;overflow-x:auto;gap:18px;padding-bottom:2px;scrollbar-width:none}.nav a{white-space:nowrap}.logo img{height:34px}}
.notice{background:var(--band);color:var(--muted);font-size:12.5px;border-bottom:1px solid var(--line)}
.notice .wrap{padding-block:6px;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
.notice a{color:var(--accent-d)}

/* photo slot: 写真が無ければ紺の面に戻る */
.photo{position:relative;overflow:hidden;background:var(--c,var(--navy));aspect-ratio:16/9;max-width:100%}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo .ph-label{position:absolute;inset:auto 0 0 0;padding:40px 18px 14px;background:linear-gradient(to top,rgba(15,41,64,.85),rgba(15,41,64,0));color:#fff;font-size:13px;letter-spacing:.06em}
.photo .ph-note{position:absolute;right:10px;top:8px;font-size:10.5px;color:var(--onnavy-muted);letter-spacing:.1em}
.photo.has-img .ph-note{display:none}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center;padding-block:64px 56px}
@media (max-width:860px){.hero{grid-template-columns:1fr;gap:32px;padding-block:40px}}
.hero>div{min-width:0}
.hero h1{font-size:clamp(28px,3.6vw,44px);line-height:1.45;margin-top:6px}
.hero h1 .nb{display:inline-block}
.hero .lead{margin-top:18px;max-width:36em;font-size:16.5px}
.search{margin-top:24px;display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:15px;padding:12px 14px;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--ink)}
.trust{background:var(--bg)}
.trust .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding-block:8px 16px}
.trust .wrap>div{background:var(--band);padding:18px 20px;text-align:center}
.trust b{display:block;font-weight:500;font-size:34px;line-height:1.2;color:var(--accent-d);font-variant-numeric:tabular-nums}
.trust span{font-size:13.5px;color:var(--muted)}

/* sections */
.sec{padding-block:48px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.sec-h h2{font-size:clamp(22px,2.6vw,28px)}
.sec-h small{font-size:13px;color:var(--muted)}
.sec-h .more{font-size:14px;text-decoration:none;color:var(--link);border-bottom:1px solid var(--link-l)}
.grid-lines{display:grid;gap:16px}
.grid-lines>*{background:var(--band);border-top:6px solid var(--navy)}
.grid-lines>*:nth-child(4n+2){border-top-color:var(--teal)}.grid-lines>*:nth-child(4n+3){border-top-color:var(--sky)}.grid-lines>*:nth-child(4n+4){border-top-color:var(--accent)}
.pains{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.pain{background:var(--band);padding:20px 20px 22px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px;min-width:0}

.pain .t{font-weight:700;font-size:18px;color:var(--navy)}
.pain .q{font-size:13px;color:var(--muted);line-height:1.7}

.pain.owner .n{margin-top:0;padding-top:0}
.pain.owner .t{color:#fff}.pain.owner .q,.pain.owner .n{color:var(--onnavy-muted)}.pain.owner .no{color:var(--accent-l)}
.pain.owner:hover{background:#163453}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{background:var(--band);border:0;border-top:6px solid var(--navy);display:flex;flex-direction:column;text-decoration:none;color:var(--ink);min-width:0}
.card:nth-child(4n+2){border-top-color:var(--teal)}.card:nth-child(4n+3){border-top-color:var(--sky)}.card:nth-child(4n+4){border-top-color:var(--accent)}
.card:hover{background:#ece7dd}
.card .b{padding:18px 20px 22px;display:flex;flex-direction:column;gap:8px}
.card .co{font-size:12px;color:var(--muted);letter-spacing:.04em}
.card .msg{font-weight:700;font-size:16.5px;line-height:1.6;color:var(--navy)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:12px;background:var(--teal);color:#fff;padding:1px 9px;text-decoration:none;border-radius:2px}
.tag.area{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.tag.online{background:var(--accent-d);color:#fff;border:0}
.empty{padding:22px;border:1px dashed var(--line);color:var(--muted);background:var(--surface)}
.empty a{color:var(--accent-d)}

/* list page */
.layout{display:grid;grid-template-columns:240px 1fr;gap:28px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.layout>div{min-width:0}
.filters{background:var(--band);border-top:6px solid var(--navy);padding:18px;display:flex;flex-direction:column;gap:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (max-width:820px){.filters{position:static}}
.filters h3{font-family:var(--sans);font-size:11px;letter-spacing:.2em;color:var(--muted);margin-bottom:6px;font-weight:500}
.filters label{display:flex;gap:8px;align-items:center;font-size:14px}
select,input[type=text],input[type=email],textarea{font:inherit;font-size:15px;width:100%;padding:9px 10px;border-radius:2px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:2px;padding:3px 10px}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.linkbtn{background:none;border:none;color:var(--link);padding:0;font-size:13px;align-self:flex-start;border-bottom:1px solid var(--link-l)}
.count{font-size:13px;color:var(--muted);margin-bottom:12px}

/* article */
.crumb{font-size:12.5px;color:var(--muted);padding-top:24px}
.crumb a{color:var(--muted)}
.art-head{padding-block:16px 28px}
.art-head .genre{font-size:12px;letter-spacing:.2em;color:var(--teal);font-weight:500}
.art-head h1{font-size:clamp(24px,3.2vw,36px);margin-top:14px}
.art-head .who{margin-top:12px;color:var(--muted);font-size:15px}
.art{display:grid;grid-template-columns:1fr 260px;gap:40px;padding-block:32px 48px;align-items:start}
@media (max-width:860px){.art{grid-template-columns:1fr}}
.art>div{min-width:0}
.art-body{display:flex;flex-direction:column;gap:36px}
.art-body h2{font-size:20px;font-weight:700;margin-bottom:12px;padding-left:12px;border-left:4px solid var(--navy)}
.art-body p+p{margin-top:10px}
.art-body ul{margin:0;padding-left:1.2em}
.qa .q{font-weight:700;color:var(--navy);font-size:18px;margin-top:22px;margin-bottom:6px}
.qa .q::before{content:"Q.";color:var(--accent);margin-right:10px;font-size:15px}
.ba{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch;margin-top:12px}
@media (max-width:560px){.ba{grid-template-columns:1fr}.ba .arr{transform:rotate(90deg);justify-self:center}}
.ba>div{background:var(--band);border:0;border-top:4px solid var(--sky);padding:14px 16px;font-size:14.5px}
.ba .lbl{font-size:11px;letter-spacing:.2em;color:var(--muted);display:block;margin-bottom:4px}
.ba .after{background:var(--navy);color:#fff;border-top-color:var(--accent)}
.ba .after .lbl{color:var(--onnavy-muted)}
.ba .arr{align-self:center;color:var(--accent)}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:0;counter-reset:s;border-top:1px solid var(--line)}
.steps li{counter-increment:s;display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:baseline;padding:14px 16px;border-bottom:1px solid var(--surface);border-left:4px solid var(--navy)}
.steps li:nth-child(odd){background:var(--band)}
.steps li:last-child{border-left-color:var(--accent)}
.steps li::before{content:"STEP " counter(s);color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap}
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (max-width:860px){.side{position:static}}
.box{background:var(--band);border-top:6px solid var(--navy);padding:18px}
.box h3{font-size:16px;margin-bottom:10px}
.kv{display:grid;grid-template-columns:84px 1fr;gap:8px 10px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
.btn{display:inline-block;border:1px solid transparent;border-radius:2px;padding:12px 22px;font-weight:700;letter-spacing:.06em;text-decoration:none;text-align:center;font-size:15px}
.btn.p{background:var(--accent);color:#fff}
.btn.p:hover{background:var(--accent-d)}
.btn.s{background:transparent;color:var(--navy);border-color:var(--navy)}
.btn.w{width:100%}
.cta-band{background:var(--navy);color:var(--onnavy);padding:36px 32px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cta-band h2{font-size:22px;color:#fff}
.cta-band p{color:var(--onnavy-muted);font-size:14px;margin-top:6px}

/* pain page */
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
@media (max-width:700px){.split{grid-template-columns:1fr}}
.split>div{background:var(--band);border-top:6px solid var(--teal);padding:22px;min-width:0}
.split h3{font-size:17px;margin-bottom:8px}
.split .own{border-top-color:var(--accent)}
.checks{list-style:none;padding:0;margin:0;display:grid;gap:0;border-top:1px solid var(--line)}
.checks li{padding:10px 0 10px 28px;position:relative;border-bottom:1px solid var(--line)}
.checks li::before{content:"";position:absolute;left:4px;top:1.15em;width:12px;height:12px;border:1px solid #b8b3ad;border-radius:50%}

/* voices / members */
.voices{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.voice{background:var(--band);border:0;border-top:6px solid var(--teal);text-decoration:none;color:var(--ink);display:flex;flex-direction:column;min-width:0}
.voice:hover{background:#ece7dd}
.voice .b{padding:18px 20px 22px}
.voice .who{font-size:12px;color:var(--muted)}
.voice .t{font-weight:700;font-size:17px;margin-top:6px;line-height:1.6;color:var(--navy)}
blockquote{margin:0;padding:22px 26px;background:var(--navy);color:#fff;font-size:19px;font-weight:700;line-height:1.6;letter-spacing:.04em}
.layers{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:700px){.layers{grid-template-columns:1fr}}
.layers>div{background:var(--band);border-top:6px solid var(--teal);padding:22px;min-width:0}
.layers h3{font-size:17px;margin:6px 0 8px}
.layers .lk{font-size:12px;letter-spacing:.12em;font-weight:500;color:var(--teal)}
.layers .priv{background:var(--navy);border-top-color:var(--accent);color:var(--onnavy)}
.layers .priv h3{color:#fff}.layers .priv .lk{color:var(--accent-l)}
.mcards{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.mcard{background:var(--band);padding:22px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mhead{display:flex;gap:12px;align-items:center}
.mhead .ic{width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.mhead .nm{font-weight:700;color:var(--navy);line-height:1.4}

.mcard .ms{font-size:14.5px}
.mcard .fc{font-size:12.5px;color:var(--muted)}
.mcard.hidden .ic{background:var(--line);color:var(--muted)}

/* forms */
.form{display:grid;gap:16px;background:var(--band);border-top:6px solid var(--navy);padding:24px}
.form label{display:grid;gap:6px;font-size:14px;font-weight:500;color:var(--navy)}
.form .hint{font-size:12px;color:var(--muted);font-weight:400}
.req{font-size:11px;color:var(--accent-d);margin-left:6px}
.done{background:var(--navy-soft);color:var(--ink);padding:12px 14px;font-size:14px;border-left:2px solid var(--navy)}

/* community */
.comm{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.comm>div{padding:22px}
.comm h3{font-size:17px}
.comm p{margin-top:6px;font-size:13.5px;color:var(--muted)}
.soon{display:inline-block;font-size:11px;letter-spacing:.1em;color:#fff;background:var(--accent-d);padding:0 7px;margin-left:8px;vertical-align:middle;font-weight:500}

/* concept */
.doc{padding-block:40px 72px}
.doc h1{font-size:30px}
.doc h2{font-size:21px;font-weight:700;margin-top:44px;padding-left:12px;border-left:4px solid var(--navy);margin-bottom:12px}
.doc p,.doc li{max-width:70ch}
.doc p+p{margin-top:10px}
.doc .lead{color:var(--muted);font-size:13px}
.tbl{overflow-x:auto;margin-top:12px}
.tbl table{border-collapse:collapse;width:100%;min-width:560px;font-size:13.5px;background:var(--surface)}
.tbl th,.tbl td{border:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top}
.tbl th{background:var(--navy);font-weight:500;color:#fff}
pre.fig{background:var(--band);border:0;padding:16px 18px;overflow-x:auto;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.7;margin:12px 0 0;color:var(--navy)}
.note{background:var(--band);border-left:2px solid var(--accent);padding:12px 16px;margin-top:14px}
footer{border-top:1px solid var(--line);background:var(--bg);margin-top:32px}
footer .wrap{padding-block:32px;display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:space-between}
footer .logos{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
footer .logos img{height:34px;width:auto;display:block}
footer .logos .sep{width:1px;height:26px;background:var(--line)}
footer .fine{font-size:12px;color:var(--muted);letter-spacing:.06em}
footer .fine a{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

const S={pain:"",area:"",online:false,visit:false,target:new Set(),tags:new Set(),q:""};
function filterCards(){
  const ok=c=>(!S.pain||c.pains.includes(+S.pain))&&(!S.area||c.area===S.area)&&(!S.online||c.online)&&(!S.visit||c.visit)
    &&(!S.target.size||[...S.target].some(t=>c.target.includes(t)))&&(!S.tags.size||[...S.tags].some(t=>c.tags.includes(t)))
    &&(!S.q||[c.name,c.genre,c.msg,...c.tags,...c.solve].join(" ").includes(S.q));
  const list=C.filter(ok);
  const conds=[S.pain&&"お悩み「"+P(+S.pain).t+"」",S.area,S.online&&"オンライン",S.visit&&"訪問可",...[...S.target].map(t=>T[t]),...S.tags,S.q&&"「"+S.q+"」"].filter(Boolean);
  $("#count").textContent=`${list.length}社`+(conds.length?`（条件：${conds.join("・")}）`:"（全件）");
  $("#cards").innerHTML=list.length?list.map(card).join(""):`<div class="empty">この条件に合う会社はまだいません。<a href="#consult">119番の窓口に相談</a>いただければ、専門家を探します。</div>`;
}
function bindPartners(){
  const sync=()=>{$("#f-pain").value=S.pain;$("#f-area").value=S.area;$("#f-online").checked=S.online;$("#f-visit").checked=S.visit;$("#f-q").value=S.q;
    document.querySelectorAll("[data-t]").forEach(b=>b.setAttribute("aria-pressed",S.target.has(b.dataset.t)));
    document.querySelectorAll("[data-g]").forEach(b=>b.setAttribute("aria-pressed",S.tags.has(b.dataset.g)))};
  $("#f-pain").onchange=e=>{S.pain=e.target.value;filterCards()};
  $("#f-area").onchange=e=>{S.area=e.target.value;filterCards()};
  $("#f-online").onchange=e=>{S.online=e.target.checked;filterCards()};
  $("#f-visit").onchange=e=>{S.visit=e.target.checked;filterCards()};
  $("#f-q").oninput=e=>{S.q=e.target.value.trim();filterCards()};
  $("#f-target").onclick=e=>{const b=e.target.closest("[data-t]");if(!b)return;const k=b.dataset.t;S.target.has(k)?S.target.delete(k):S.target.add(k);sync();filterCards()};
  $("#f-tags").onclick=e=>{const b=e.target.closest("[data-g]");if(!b)return;const k=b.dataset.g;S.tags.has(k)?S.tags.delete(k):S.tags.add(k);sync();filterCards()};
  $("#reset").onclick=()=>{S.pain=S.area=S.q="";S.online=S.visit=false;S.target.clear();S.tags.clear();sync();filterCards()};
  sync();filterCards();
}

  <p>有璽氏の回答は「事例と非公開会員で関わる」と「両方公開」の両方。2層に分けて両立させます。</p>
  <pre class="fig">だれでも見られる（希望する施設のみ）     会員だけ
  施設名・種類・所在地・事業所数           悩みの共有（相談会・匿名可）
  経営者のひと言                            テーマ別の分科会
  取り組んでいること                        会員どうしの連絡（119番が間に入る）
  話したいテーマ                            パートナーへの相談履歴
        ＋ 経営者の声（事例インタビュー）</pre>
  <p><strong>悩みそのものは公開しません。</strong>公開の一覧に出すのは「話したいテーマ」までです。施設経営者が弱みを晒さずに参加でき、それでも一覧には施設が並ぶので、コミュニティとしての賑わいが出ます。施設名を伏せた参加も選べます。</p>
  <p><strong>載せないもの：</strong>利用者・職員の募集。入れると施設紹介サイトに性格が寄り、見に来る人が利用者・保護者・求職者に広がるためです。</p>
  <p><strong>新たに決めること：</strong>参加できる施設の条件（119番の顧客に限るか、誰でもか）／会員の場を何で作るか（Slack・LINE オープンチャット・専用の会員ページ）／参加費の有無。</p>
  <h2>10. 決めること・確かめること</h2>
  <ul>
    <li><strong>紹介料・送客手数料を取るか。</strong>人材紹介・保険・融資は、紹介して対価を受け取ると職業安定法・保険業法・貸金業法などに触れる可能性があります。取る場合はジャンルごとに法務の確認を先に通します。</li>
    <li><strong>掲載の基準と掲載料。</strong>試作の「掲載の条件（案）」で足りるか。</li>
    <li><strong>相談の受け方。</strong>119番の窓口で一度受けるか、各社へ直接つなぐか（試作は前者）。初回相談無料と書いてよいか。</li>
    <li><strong>サイトの置き場所。</strong>119番のサイトの下に置くか、別ドメインにするか。</li>
    <li><strong>空いている分野の候補。</strong>中小企業診断士・社労士・集客支援・保護者対応の専門家に心当たりはあるか。</li>
  </ul>
  <p class="note">試作の会社名・人名・事例・写真はすべて架空です。実際の掲載は、ご本人の承諾と原稿確認を取ってからにします。</p>
</article>`;

/* ---- router ---- */
function route(){
  const h=(location.hash||"#top").slice(1);
  let html,nav="";
  if(h==="top"||h==="proto"||h===""){html=vTop()}
  else if(h==="nayami"){html=vNayamiIndex();nav="nayami"}
  else if(h.startsWith("nayami-")){html=vNayami(+h.slice(7));nav="nayami"}
  else if(h==="partners"){html=vPartners();nav="partners"}
  else if(h.startsWith("p-")){html=vPartner(h.slice(2));nav="partners"}
  else if(h==="voices"){html=vVoices();nav="voices"}
  else if(h==="members"){html=vMembers();nav="members"}
  else if(h.startsWith("v-")){html=vVoice(h.slice(2));nav="voices"}
  else if(h==="join"){html=vJoin();nav="join"}
  else if(h==="consult"){html=vConsult("");nav="consult"}
  else if(h.startsWith("consult-")){html=vConsult(h.slice(8));nav="consult"}
  else if(h==="concept"){html=CONCEPT}
  else html=vNotFound();
  $("#app").innerHTML=html;
  document.querySelectorAll("[data-nav]").forEach(a=>a.toggleAttribute("aria-current",a.dataset.nav===nav));
  document.querySelectorAll("[data-nav][aria-current]").forEach(a=>a.setAttribute("aria-current","page"));
  if(nav==="partners"&&h==="partners")bindPartners();
  const ts=$("#topsearch");if(ts)ts.onsubmit=e=>{e.preventDefault();S.q=$("#q0").value.trim();location.hash="#partners"};
  const jf=$("#joinform");if(jf)jf.onsubmit=e=>{e.preventDefault();$("#j-done").innerHTML='<div class="done">試作のため送信はしません。本番では119番の担当から面談のご案内をお送りします。</div>'};
  const mf=$("#memberform");if(mf)mf.onsubmit=e=>{e.preventDefault();$("#m-done").innerHTML='<div class="done">試作のため送信はしません。本番では119番の担当が施設の確認をしてから、会員の場へご案内します。</div>'};
  const cf=$("#consultform");if(cf)cf.onsubmit=e=>{e.preventDefault();$("#c-done").innerHTML='<div class="done">試作のため送信はしません。本番では119番の窓口が受け付け、2営業日以内にご連絡する想定です。</div>'};
  window.scrollTo(0,0);
}
addEventListener("hashchange",route);
route();
</script>
