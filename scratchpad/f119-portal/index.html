<title>119番 解決パートナー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: お悩み → 解決パートナーの記事 → 119番の窓口で相談、の一方向。ページはハッシュで切り替える */
:root{
  --bg:#f6f7f6; --surface:#ffffff; --ink:#1d2a2e; --muted:#5b6b70; --line:#dde3e2;
  --accent:#c8442f; --accent-soft:#f7e3de; --teal:#1f5f66; --teal-soft:#dcebec;
  --warn:#8a5a00; --warn-soft:#fbefd2; --onaccent:#ffffff;
  --display:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a1c; --surface:#1a2427; --ink:#e6eceb; --muted:#9db0b3; --line:#2c3a3d;
  --accent:#ec7a63; --accent-soft:#3a221d; --teal:#7cc2c8; --teal-soft:#1d3336;
  --warn:#f0c46a; --warn-soft:#3a2f17; --onaccent:#1a0f0c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a1c; --surface:#1a2427; --ink:#e6eceb; --muted:#9db0b3; --line:#2c3a3d;
  --accent:#ec7a63; --accent-soft:#3a221d; --teal:#7cc2c8; --teal-soft:#1d3336;
  --warn:#f0c46a; --warn-soft:#3a2f17; --onaccent:#1a0f0c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.8}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.narrow{max-width:820px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.4;margin:0}
p{margin:0}
a{color:var(--teal)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:8px 20px;padding-block:10px;flex-wrap:wrap}
.logo{display:flex;align-items:baseline;gap:8px;font-family:var(--display);font-weight:900;text-decoration:none;color:var(--ink)}
.logo b{color:var(--accent);font-size:20px;letter-spacing:.02em}
.logo span{font-size:13px}
.nav{display:flex;gap:2px 14px;flex-wrap:wrap;margin-left:auto;align-items:center}
.nav a{text-decoration:none;color:var(--ink);font-size:13.5px;font-weight:500;padding-block:4px}
.nav a[aria-current="page"]{color:var(--accent);font-weight:700}
.nav a.cta-s{background:var(--accent);color:var(--onaccent);padding:6px 14px;border-radius:999px;font-weight:700}
.notice{background:var(--warn-soft);color:var(--warn);font-size:12.5px}
.notice .wrap{padding-block:6px;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
.notice a{color:var(--warn);font-weight:700}

/* photo slot: 写真が無ければ色帯に戻る */
.photo{position:relative;overflow:hidden;background:var(--c,var(--teal));aspect-ratio:16/9;max-width:100%}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo .ph-label{position:absolute;left:12px;bottom:10px;font-family:var(--display);font-weight:900;color:#fff;font-size:20px;text-shadow:0 1px 6px rgba(0,0,0,.25)}
.photo.has-img .ph-label{display:none}
.photo .ph-note{position:absolute;right:10px;top:8px;font-size:10.5px;color:#fff;opacity:.8}
.photo.has-img .ph-note{display:none}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;align-items:center;padding-block:36px 24px}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.hero>div{min-width:0}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:700}
.hero h1{font-size:clamp(26px,4vw,40px);font-weight:900;margin-top:6px}
.hero p{color:var(--muted);margin-top:12px;max-width:60ch}
.hero .photo{border-radius:16px}
.search{margin-top:20px;display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.stats{display:flex;gap:20px;flex-wrap:wrap;margin-top:18px;font-size:13px;color:var(--muted)}
.stats b{font-family:var(--display);font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:4px}

/* sections */
.sec{padding-block:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-h h2{font-size:22px}
.sec-h small,.sec-h a{font-size:13px;color:var(--muted)}
.sec-h a{color:var(--teal)}
.pains{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.pain{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:4px;min-width:0}
.pain:hover{border-color:var(--teal)}
.pain .no{font-size:11px;color:var(--muted);letter-spacing:.08em}
.pain .t{font-family:var(--display);font-weight:700;font-size:16px}
.pain .q{font-size:12.5px;color:var(--muted);line-height:1.6}
.pain .n{font-size:12px;color:var(--teal);font-weight:700;margin-top:auto}
.pain .n.zero{color:var(--accent)}
.pain.owner{background:var(--accent-soft);border-color:transparent}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:var(--ink);min-width:0}
.card:hover{border-color:var(--teal)}
.card .b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.card .co{font-size:12px;color:var(--muted)}
.card .msg{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.55}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:11.5px;background:var(--teal-soft);color:var(--teal);border-radius:6px;padding:1px 8px;text-decoration:none}
.tag.area{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.tag.online{background:var(--accent-soft);color:var(--accent)}
.empty{padding:20px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);background:var(--surface)}
.empty a{font-weight:700}

/* list page */
.layout{display:grid;grid-template-columns:240px 1fr;gap:24px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.layout>div{min-width:0}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
@media (max-width:820px){.filters{position:static}}
.filters h3{font-size:13px;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.filters label{display:flex;gap:8px;align-items:center;font-size:14px}
select,input[type=text],input[type=email],textarea{font:inherit;width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:3px 10px}
.chip[aria-pressed="true"]{background:var(--teal);color:var(--surface);border-color:var(--teal)}
.linkbtn{background:none;border:none;color:var(--teal);text-decoration:underline;padding:0;font-size:13px;align-self:flex-start}
.count{font-size:13px;color:var(--muted);margin-bottom:10px}

/* article */
.crumb{font-size:12.5px;color:var(--muted);padding-top:20px}
.crumb a{color:var(--muted)}
.art-head{padding-block:12px 20px}
.art-head .genre{font-size:12.5px;color:var(--accent);font-weight:700;letter-spacing:.06em}
.art-head h1{font-size:clamp(24px,3.4vw,34px);font-weight:900;margin-top:6px}
.art-head .who{margin-top:10px;color:var(--muted);font-size:14px}
.art-photo{border-radius:16px}
.art{display:grid;grid-template-columns:1fr 260px;gap:32px;padding-block:24px 40px;align-items:start}
@media (max-width:860px){.art{grid-template-columns:1fr}}
.art>div{min-width:0}
.art-body{display:flex;flex-direction:column;gap:30px}
.art-body h2{font-size:19px;padding-left:12px;border-left:4px solid var(--accent);margin-bottom:10px}
.art-body p+p{margin-top:10px}
.art-body ul{margin:0;padding-left:1.2em}
.qa .q{font-weight:700;font-family:var(--display);margin-top:14px}
.qa .q::before{content:"Q. ";color:var(--accent)}
.ba{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin-top:10px}
@media (max-width:560px){.ba{grid-template-columns:1fr}.ba .arr{transform:rotate(90deg);justify-self:center}}
.ba>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px}
.ba .lbl{font-size:11px;letter-spacing:.08em;color:var(--muted);display:block}
.ba .after{border-color:var(--teal)}
.ba .arr{align-self:center;color:var(--muted)}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:8px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;font-weight:700;font-size:13px}
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
@media (max-width:860px){.side{position:static}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.box h3{font-size:14px;margin-bottom:8px}
.kv{display:grid;grid-template-columns:84px 1fr;gap:6px 10px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
.btn{display:inline-block;border:none;border-radius:10px;padding:11px 18px;font-weight:700;text-decoration:none;text-align:center}
.btn.p{background:var(--accent);color:var(--onaccent)}
.btn.s{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.w{width:100%}
.cta-band{background:var(--teal-soft);border-radius:16px;padding:24px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cta-band h2{font-size:19px}
.cta-band p{color:var(--muted);font-size:14px;margin-top:4px}

/* pain page */
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
@media (max-width:700px){.split{grid-template-columns:1fr}}
.split>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.split h3{font-size:15px;margin-bottom:6px}
.split .own{border-color:var(--accent)}
.checks{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.checks li{padding-left:22px;position:relative}
.checks li::before{content:"";position:absolute;left:2px;top:.6em;width:10px;height:10px;border:2px solid var(--teal);border-radius:3px}

/* voices */
.voices{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.voice{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;min-width:0}
.voice .b{padding:14px 16px 16px}
.voice .who{font-size:12px;color:var(--muted)}
.voice .t{font-family:var(--display);font-weight:700;font-size:17px;margin-top:4px;line-height:1.5}
blockquote{margin:0;padding:14px 18px;background:var(--surface);border-left:4px solid var(--teal);border-radius:0 10px 10px 0;font-family:var(--display);font-size:17px;font-weight:700}

/* forms */
.form{display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.form label{display:grid;gap:6px;font-size:14px;font-weight:500}
.form .hint{font-size:12px;color:var(--muted);font-weight:400}
.req{font-size:11px;color:var(--accent);margin-left:6px}
.done{background:var(--teal-soft);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:14px}

/* community */
.comm{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.comm div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.comm h3{font-size:16px}
.comm p{margin-top:6px;font-size:13.5px;color:var(--muted)}
.soon{display:inline-block;font-size:11px;background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:middle;font-family:var(--body);font-weight:700}

/* concept */
.doc{padding-block:32px 64px}
.doc h1{font-size:30px}
.doc h2{font-size:21px;margin-top:40px;padding-top:16px;border-top:1px solid var(--line);margin-bottom:10px}
.doc p,.doc li{max-width:70ch}
.doc p+p{margin-top:10px}
.doc .lead{color:var(--muted)}
.tbl{overflow-x:auto;margin-top:10px}
.tbl table{border-collapse:collapse;width:100%;min-width:560px;font-size:13.5px;background:var(--surface)}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--bg);font-weight:700}
pre.fig{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto;font-size:13px;line-height:1.6;margin:10px 0 0}
.note{background:var(--warn-soft);border-radius:10px;padding:12px 16px;margin-top:12px}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;margin-top:20px}
footer .wrap{padding-block:22px;display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}
footer a{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

const S={pain:"",area:"",online:false,visit:false,target:new Set(),tags:new Set(),q:""};
function filterCards(){
  const ok=c=>(!S.pain||c.pains.includes(+S.pain))&&(!S.area||c.area===S.area)&&(!S.online||c.online)&&(!S.visit||c.visit)
    &&(!S.target.size||[...S.target].some(t=>c.target.includes(t)))&&(!S.tags.size||[...S.tags].some(t=>c.tags.includes(t)))
    &&(!S.q||[c.name,c.genre,c.msg,...c.tags,...c.solve].join(" ").includes(S.q));
  const list=C.filter(ok);
  const conds=[S.pain&&"お悩み「"+P(+S.pain).t+"」",S.area,S.online&&"オンライン",S.visit&&"訪問可",...[...S.target].map(t=>T[t]),...S.tags,S.q&&"「"+S.q+"」"].filter(Boolean);
  $("#count").textContent=`${list.length}社`+(conds.length?`（条件：${conds.join("・")}）`:"（全件）");
  $("#cards").innerHTML=list.length?list.map(card).join(""):`<div class="empty">この条件に合う会社はまだいません。<a href="#consult">119番の窓口に相談</a>いただければ、専門家を探します。</div>`;
}
function bindPartners(){
  const sync=()=>{$("#f-pain").value=S.pain;$("#f-area").value=S.area;$("#f-online").checked=S.online;$("#f-visit").checked=S.visit;$("#f-q").value=S.q;
    document.querySelectorAll("[data-t]").forEach(b=>b.setAttribute("aria-pressed",S.target.has(b.dataset.t)));
    document.querySelectorAll("[data-g]").forEach(b=>b.setAttribute("aria-pressed",S.tags.has(b.dataset.g)))};
  $("#f-pain").onchange=e=>{S.pain=e.target.value;filterCards()};
  $("#f-area").onchange=e=>{S.area=e.target.value;filterCards()};
  $("#f-online").onchange=e=>{S.online=e.target.checked;filterCards()};
  $("#f-visit").onchange=e=>{S.visit=e.target.checked;filterCards()};
  $("#f-q").oninput=e=>{S.q=e.target.value.trim();filterCards()};
  $("#f-target").onclick=e=>{const b=e.target.closest("[data-t]");if(!b)return;const k=b.dataset.t;S.target.has(k)?S.target.delete(k):S.target.add(k);sync();filterCards()};
  $("#f-tags").onclick=e=>{const b=e.target.closest("[data-g]");if(!b)return;const k=b.dataset.g;S.tags.has(k)?S.tags.delete(k):S.tags.add(k);sync();filterCards()};
  $("#reset").onclick=()=>{S.pain=S.area=S.q="";S.online=S.visit=false;S.target.clear();S.tags.clear();sync();filterCards()};
  sync();filterCards();
}

  <pre class="fig">  施設経営者のお悩み（10分類＋経営者本人）
            │
            ├─ 119番で解けるもの（◎○ 24件）──→ 健康診断・ドック・月額3本
            │
            └─ 119番では触れないもの（△ 94件）──→ 解決パートナー（このサイト）
                                                     │

  <h2>2. 前提と制約</h2>

    <li>掲載候補の承諾は未取得。試作の社名・人名・事例・写真はすべて架空。</li>
    <li>最終的には、福祉経営者と親和性のある会社を束ねたコミュニティにする。</li>
    <li>参考サイト Bowers の絞り込みは業種だけ。お悩み・エリア・タグからの入口は、このサイトで独自に足すもの。</li>
  </ul>

  <h2>8. この形の利点と弱点</h2>
  <p><strong>利点</strong>：経営者は会社名ではなく困りごとで探すので、入口が合っています。相談が119番の窓口に集まるので、119番の見込み客も同時に取れます。空いている分類が「募集中」として見えるので、次に声をかける相手が決まります。</p>
  <p><strong>弱点</strong>：119番の名前で紹介する以上、紹介先の質が119番の評判に返ってきます。掲載社が少ないうちに細かいタグやエリアを出すと、該当0件ばかりに見えます。記事の取材と更新の手間は、掲載社が増えるほど大きくなります。</p>
  <h2>9. 決めること・確かめること</h2>
  <ul>
    <li><strong>紹介料・送客手数料を取るか。</strong>人材紹介・保険・融資は、紹介して対価を受け取ると職業安定法・保険業法・貸金業法などに触れる可能性があります。取る場合はジャンルごとに法務の確認を先に通します。</li>
    <li><strong>掲載の基準と掲載料。</strong>試作の「掲載の条件（案）」で足りるか。</li>
    <li><strong>相談の受け方。</strong>119番の窓口で一度受けるか、各社へ直接つなぐか（試作は前者）。初回相談無料と書いてよいか。</li>
    <li><strong>サイトの置き場所。</strong>119番のサイトの下に置くか、別ドメインにするか。</li>
    <li><strong>空いている分野の候補。</strong>中小企業診断士・社労士・集客支援・保護者対応の専門家に心当たりはあるか。</li>
  </ul>
  <p class="note">試作の会社名・人名・事例・写真はすべて架空です。実際の掲載は、ご本人の承諾と原稿確認を取ってからにします。</p>

/* ---- router ---- */
function route(){
  const h=(location.hash||"#top").slice(1);
  let html,nav="";
  if(h==="top"||h==="proto"||h===""){html=vTop()}
  else if(h==="nayami"){html=vNayamiIndex();nav="nayami"}
  else if(h.startsWith("nayami-")){html=vNayami(+h.slice(7));nav="nayami"}
  else if(h==="partners"){html=vPartners();nav="partners"}
  else if(h.startsWith("p-")){html=vPartner(h.slice(2));nav="partners"}
  else if(h==="voices"){html=vVoices();nav="voices"}
  else if(h.startsWith("v-")){html=vVoice(h.slice(2));nav="voices"}
  else if(h==="join"){html=vJoin();nav="join"}
  else if(h==="consult"){html=vConsult("");nav="consult"}
  else if(h.startsWith("consult-")){html=vConsult(h.slice(8));nav="consult"}
  else if(h==="concept"){html=CONCEPT}
  else html=vNotFound();
  $("#app").innerHTML=html;
  document.querySelectorAll("[data-nav]").forEach(a=>a.toggleAttribute("aria-current",a.dataset.nav===nav));
  document.querySelectorAll("[data-nav][aria-current]").forEach(a=>a.setAttribute("aria-current","page"));
  if(nav==="partners"&&h==="partners")bindPartners();
  const ts=$("#topsearch");if(ts)ts.onsubmit=e=>{e.preventDefault();S.q=$("#q0").value.trim();location.hash="#partners"};
  const jf=$("#joinform");if(jf)jf.onsubmit=e=>{e.preventDefault();$("#j-done").innerHTML='<div class="done">試作のため送信はしません。本番では119番の担当から面談のご案内をお送りします。</div>'};
  const cf=$("#consultform");if(cf)cf.onsubmit=e=>{e.preventDefault();$("#c-done").innerHTML='<div class="done">試作のため送信はしません。本番では119番の窓口が受け付け、2営業日以内にご連絡する想定です。</div>'};
  window.scrollTo(0,0);
}
addEventListener("hashchange",route);
route();
