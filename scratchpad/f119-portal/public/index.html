<!-- ===== ふくち。計測セット v2（bin/web_tracking/snippet.html）=====
     <head> の直後に丸ごと貼る。二重の波括弧で書かれた4か所（下の script 内）だけ差し替える。
       SB_TRACK_ID / SB_TRACK_TOKEN  SalesBreaker 1行タグ（どの会社が来たか）
                         SalesBreaker 画面の「1行タグ」から id と token をそのまま写す
       GTM_ID            GTM コンテナ（GA4 はコンテナ内で配信）
       CLARITY_ID        Microsoft Clarity（録画・ヒートマップ・クリック）★サイトごとに1つ作る
     ボタンやリンクに data-cta="<置き場所>" を付けると、どれが押されたかが案別に残る。
     v2（2026-09-29）：経路（utm_source）を最初のページで確定して保持／tel・mailto は種別だけ送る／form 送信も記録
     ============================================================== -->

<script>
/* クリックログ：案（パス）・経路（utm_source）・押した場所（data-cta）を GA4 と Clarity の両方へ */
(function(){
  var seg = location.pathname.split('/').filter(Boolean);           // 例 /kids/a → ['kids','a']
  var variant = seg.join('-').replace(/\.html?$/, '').replace(/-?index$/, '') || 'root';
  var q = new URLSearchParams(location.search);
  // 経路：最初に決まったものを sessionStorage に保持し、同じサイトの2ページ目以降も使う
  // （2ページ目の参照元は自分のサイトなので、保持しないと ig から来た人が referral になる）。
  // ただし最初が direct / referral のときは、あとで来た utm_source（より確かな情報）を採る。
  // sessionStorage が使えない環境（プライベート等）では、従来どおりそのページだけで決める。
  var KEY = 'fk_lp_source';
  function ssGet(){ try { return sessionStorage.getItem(KEY); } catch(e){ return null; } }
  function ssSet(v){ try { sessionStorage.setItem(KEY, v); } catch(e){} }
  var utm = q.get('utm_source'), stored = ssGet(), source;
  if (utm && (!stored || stored === 'direct' || stored === 'referral')) { source = utm; ssSet(source); }
  else if (stored) { source = stored; }
  else { source = utm || (document.referrer ? 'referral' : 'direct'); ssSet(source); }
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({ event: 'page_meta', lp_variant: variant, lp_source: source });
  function cl(){ try { window.clarity && window.clarity.apply(null, arguments); } catch(e){} }
  cl('set', 'lp_variant', variant);
  cl('set', 'lp_source', source);
  // 押した場所の名前。tel: と mailto: は電話番号・メールアドレスを送らず種別だけにする
  function ctaOf(el){
    var c = el.getAttribute('data-cta');
    if (c) return c;
    var h = el.getAttribute('href') || '';
    if (/^tel:/i.test(h)) return 'tel';
    if (/^mailto:/i.test(h)) return 'mailto';
    return h.slice(0, 80);
  }
  document.addEventListener('click', function(e){
    var t = e.target;
    var el = t && t.closest && t.closest('[data-cta], a[href]');
    if (!el) return;
    var cta = ctaOf(el);
    window.dataLayer.push({ event: 'cta_click', lp_variant: variant, lp_source: source, cta: cta });
    cl('event', 'cta_click');
    if (el.hasAttribute('data-cta')) cl('event', 'cta_' + el.getAttribute('data-cta'));
  }, true);
  // form 送信（Enter キー送信・data-cta の無い form も拾う）。action のクエリ（token 等）は送らない
  document.addEventListener('submit', function(e){
    var f = e.target;
    if (!f || !f.getAttribute) return;
    var cta = f.getAttribute('data-cta') || (f.getAttribute('id') ? 'form-' + f.getAttribute('id') : '') ||
              (f.getAttribute('action') || '').split('?')[0].split('#')[0].slice(0, 80) || 'form';
    window.dataLayer.push({ event: 'form_submit', lp_variant: variant, lp_source: source, cta: cta });
    cl('event', 'form_submit');
  }, true);
})();
</script>

<style>
/* Layout: 福祉施設の119番 Design System v0.1 */
:root{
color-scheme:light;

--f119-band-1:var(--f119-navy);--f119-band-2:var(--f119-teal);--f119-band-3:var(--f119-sky);--f119-band-4:var(--f119-orange);

--sp-2:8px;--sp-4:16px;--sp-6:24px;--sp-8:32px;--container:1200px;--container-read:760px;--section-y:80px;--section-y-tight:56px;
--r-base:2px;--band-height:6px;--bar-w:40px;--bar-h:4px;
--sh-xs:0 1px 2px rgba(14,42,71,.06);--sh-md:0 4px 16px rgba(14,42,71,.10);
--scrim-left:linear-gradient(90deg,rgba(14,42,71,.88) 0%,rgba(14,42,71,.55) 55%,rgba(14,42,71,0) 100%);
--scrim-bottom:linear-gradient(0deg,rgba(14,42,71,.88) 0%,rgba(14,42,71,.4) 50%,rgba(14,42,71,0) 100%);

}
@media (prefers-reduced-motion:reduce){:root{--dur-fast:0ms;--dur-base:0ms}*,*::before,*::after{transition-duration:0ms!important;animation-duration:0ms!important;scroll-behavior:auto!important}}

/* sections */
.sec{padding-block:var(--section-y-tight)}

.grid-lines>*:nth-child(4n+2){border-top-color:var(--f119-band-2)}.grid-lines>*:nth-child(4n+3){border-top-color:var(--f119-band-3)}.grid-lines>*:nth-child(4n+4){border-top-color:var(--f119-band-4)}

/* StepList */
.steps{list-style:none;padding:0;margin:0;border:1px solid var(--f119-line);border-radius:var(--r-base);overflow:hidden;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:4px minmax(0,72px) minmax(0,1fr);column-gap:18px;align-items:center;background:#fff;font-size:15px;line-height:var(--lh-sm)}
.steps li:nth-child(odd){background:var(--f119-sand)}
.steps li::before{content:"";grid-column:1;grid-row:1;align-self:stretch;background:var(--f119-band-1)}
.steps li:nth-child(4n+2)::before{background:var(--f119-band-2)}.steps li:nth-child(4n+3)::before{background:var(--f119-band-3)}.steps li:nth-child(4n+4)::before{background:var(--f119-band-4)}
.steps li::after{content:"STEP " counter(s);order:-1;grid-column:2;grid-row:1;font-family:var(--font-latin);font-size:13px;font-weight:600;letter-spacing:.12em;color:var(--f119-navy);padding:16px 0}
.steps li>span{grid-column:3;grid-row:1;padding:14px 16px 14px 0}
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (max-width:900px){.side{position:static}}
.box{background:var(--f119-sand);border-top:var(--band-height) solid var(--f119-navy);border-radius:var(--r-base);padding:20px}
.box h3{font-size:var(--fs-h3);font-weight:700;margin-bottom:10px}
.kv{display:grid;grid-template-columns:84px 1fr;gap:8px 10px;font-size:var(--fs-sm);margin:0}
.kv dt{color:var(--f119-sub)}
.kv dd{margin:0;min-width:0}
/* Button */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--r-base);padding:12px 22px;font-size:15px;font-weight:500;letter-spacing:.04em;line-height:1.3;text-decoration:none;text-align:center;transition:background var(--dur-base) var(--ease-out),transform var(--dur-fast) var(--ease-out)}
.btn:active{transform:scale(var(--press-scale))}
.btn.p{background:var(--f119-orange-solid);border-color:var(--f119-orange-solid);color:#fff}
.btn.p:hover{background:var(--f119-orange-solid-hover);border-color:var(--f119-orange-solid-hover);color:#fff}
.btn.lg{background:var(--f119-orange);border-color:var(--f119-orange);color:#fff;font-size:var(--fs-cta-large);font-weight:700;padding:14px 28px}
.btn.lg:hover{background:var(--f119-orange-solid);border-color:var(--f119-orange-solid);color:#fff}
.btn.s{background:#fff;color:var(--f119-navy);border-color:var(--f119-navy)}
.btn.s:hover{background:var(--f119-sand)}
.btn.dk{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
.btn.dk:hover{background:rgba(255,255,255,.08);color:#fff}
.btn.w{width:100%}
/* ConclusionBand（相談への誘導） */
.cta-band{background:var(--f119-navy);color:#fff;padding:28px 32px;border-radius:var(--r-base);display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;position:relative}
.cta-band::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--f119-orange)}
.cta-band h2{font-size:20px;color:#fff;font-weight:500}
.cta-band p{color:var(--f119-on-dark-muted);font-size:var(--fs-sm);margin-top:6px}

/* pain page */
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}
@media (max-width:700px){.split{grid-template-columns:1fr}}
.split>div{background:var(--f119-sand);border-top:var(--band-height) solid var(--f119-teal);border-radius:var(--r-base);padding:22px;min-width:0}
.split h3{font-size:var(--fs-h3);font-weight:700;margin-bottom:8px}
.split .own{border-top-color:var(--f119-navy)}
.checks{list-style:none;padding:0;margin:0;border-top:1px solid var(--f119-line)}
.checks li{padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--f119-line)}
.checks li::before{content:"";position:absolute;left:4px;top:1.2em;width:14px;height:14px;border:1px solid var(--f119-sub);border-radius:var(--r-base)}

.layers{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.mhead .nm{font-weight:700;color:var(--f119-navy);line-height:1.4}

.mcard .ms{font-size:15px;line-height:var(--lh-sm)}
.mcard .fc{font-size:13px;color:var(--f119-sub)}

/* Field / Input */
.form{display:grid;gap:18px;background:var(--f119-sand);border-top:var(--band-height) solid var(--f119-navy);border-radius:var(--r-base);padding:24px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:var(--fs-sm);font-weight:700;color:var(--f119-navy)}

.req{display:inline-block;background:var(--f119-teal);color:#fff;font-size:var(--fs-cap);font-weight:700;letter-spacing:var(--tr-label);padding:0 6px;border-radius:var(--r-base);margin-left:8px;align-self:flex-start}
.done{background:#fff;color:var(--f119-ink);padding:12px 14px;font-size:15px;border-left:4px solid var(--f119-navy);border-radius:var(--r-base)}

/* community */
.comm{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.comm>div{padding:22px}
.comm h3{font-size:var(--fs-h3);font-weight:700}
.comm p{margin-top:6px;font-size:15px;line-height:var(--lh-sm)}
.soon{display:inline-block;font-size:var(--fs-cap);font-weight:700;letter-spacing:var(--tr-label);color:#fff;background:var(--f119-navy);padding:0 7px;margin-left:8px;vertical-align:middle;border-radius:var(--r-base)}

.about119{background:var(--f119-sand);border-radius:var(--r-base);padding:28px 32px;display:grid;grid-template-columns:auto 1fr auto;gap:20px 28px;align-items:center}

const S={pain:"",area:"",online:false,visit:false,target:new Set(),tags:new Set(),q:""};
function filterCards(){
  const ok=c=>(!S.pain||c.pains.includes(+S.pain))&&(!S.area||c.area===S.area)&&(!S.online||c.online)&&(!S.visit||c.visit)
    &&(!S.target.size||[...S.target].some(t=>c.target.includes(t)))&&(!S.tags.size||[...S.tags].some(t=>c.tags.includes(t)))
    &&(!S.q||[c.name,c.genre,c.msg,...c.tags,...c.solve].join(" ").includes(S.q));
  const list=C.filter(ok);
  const conds=[S.pain&&"お悩み「"+P(+S.pain).t+"」",S.area,S.online&&"オンライン",S.visit&&"訪問可",...[...S.target].map(t=>T[t]),...S.tags,S.q&&"「"+S.q+"」"].filter(Boolean);
  $("#count").textContent=`${list.length}社`+(conds.length?`（条件：${conds.join("・")}）`:"（全件）");
  $("#cards").innerHTML=list.length?list.map(card).join(""):`<div class="empty">この条件に合う会社はまだいません。<a href="#consult">119番の窓口に相談</a>いただければ、専門家を探します。</div>`;
}
function bindPartners(){
  const sync=()=>{$("#f-pain").value=S.pain;$("#f-area").value=S.area;$("#f-online").checked=S.online;$("#f-visit").checked=S.visit;$("#f-q").value=S.q;
    document.querySelectorAll("[data-t]").forEach(b=>b.setAttribute("aria-pressed",S.target.has(b.dataset.t)));
    document.querySelectorAll("[data-g]").forEach(b=>b.setAttribute("aria-pressed",S.tags.has(b.dataset.g)))};
  $("#f-pain").onchange=e=>{S.pain=e.target.value;filterCards()};
  $("#f-area").onchange=e=>{S.area=e.target.value;filterCards()};
  $("#f-online").onchange=e=>{S.online=e.target.checked;filterCards()};
  $("#f-visit").onchange=e=>{S.visit=e.target.checked;filterCards()};
  $("#f-q").oninput=e=>{S.q=e.target.value.trim();filterCards()};
  $("#f-target").onclick=e=>{const b=e.target.closest("[data-t]");if(!b)return;const k=b.dataset.t;S.target.has(k)?S.target.delete(k):S.target.add(k);sync();filterCards()};
  $("#f-tags").onclick=e=>{const b=e.target.closest("[data-g]");if(!b)return;const k=b.dataset.g;S.tags.has(k)?S.tags.delete(k):S.tags.add(k);sync();filterCards()};
  $("#reset").onclick=()=>{S.pain=S.area=S.q="";S.online=S.visit=false;S.target.clear();S.tags.clear();sync();filterCards()};
  sync();filterCards();
}

function vNotFound(){return `<section class="wrap narrow sec"><div class="empty">ページが見つかりません。<a href="#top">トップへ戻る</a></div></section>`}



/* ---- router ---- */
function route(){
  const h=(location.hash||"#top").slice(1);
  let html,nav="";
  if(h==="top"||h==="proto"||h===""){html=vTop()}
  else if(h==="nayami"){html=vNayamiIndex();nav="nayami"}
  else if(h.startsWith("nayami-")){html=vNayami(+h.slice(7));nav="nayami"}
  else if(h==="partners"){html=vPartners();nav="partners"}
  else if(h.startsWith("p-")){html=vPartner(h.slice(2));nav="partners"}
  else if(h==="voices"){html=vVoices();nav="voices"}
  else if(h==="members"){html=vMembers();nav="members"}
  else if(h.startsWith("v-")){html=vVoice(h.slice(2));nav="voices"}
  else if(h==="join"){html=vJoin();nav="join"}
  else if(h==="consult"){html=vConsult("");nav="consult"}
  else if(h.startsWith("consult-")){html=vConsult(h.slice(8));nav="consult"}
  else html=vNotFound();
  $("#app").innerHTML=html;
  document.querySelectorAll("[data-nav]").forEach(a=>a.toggleAttribute("aria-current",a.dataset.nav===nav));
  document.querySelectorAll("[data-nav][aria-current]").forEach(a=>a.setAttribute("aria-current","page"));
  if(nav==="partners"&&h==="partners")bindPartners();
  const ts=$("#topsearch");if(ts)ts.onsubmit=e=>{e.preventDefault();S.q=$("#q0").value.trim();location.hash="#partners"};
  const jf=$("#joinform");if(jf)jf.onsubmit=e=>{e.preventDefault();$("#j-done").innerHTML='<div class="done">試作のため送信はしません。本番では119番の担当から面談のご案内をお送りします。</div>'};
  const mf=$("#memberform");if(mf)mf.onsubmit=e=>{e.preventDefault();$("#m-done").innerHTML='<div class="done">試作のため送信はしません。本番では119番の担当が施設の確認をしてから、会員の場へご案内します。</div>'};
  const cf=$("#consultform");if(cf)cf.onsubmit=e=>{e.preventDefault();$("#c-done").innerHTML='<div class="done">試作のため送信はしません。本番では119番の窓口が受け付け、2営業日以内にご連絡する想定です。</div>'};
  window.scrollTo(0,0);
}
addEventListener("hashchange",route);
route();
</script>
